<header class="topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-link text-aqua d-lg-none p-0" id="sidebarToggle" type="button">
      <i class="fas fa-bars fa-lg"></i>
    </button>
    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
  </div>
  <div class="d-flex align-items-center gap-3">
    <a href="{% url 'notifications:notification_list' %}" class="btn btn-link text-aqua position-relative p-1">
      <i class="fas fa-bell fa-lg"></i>
      {% if unread_notification_count %}
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.65rem;">
        {{ unread_notification_count }}
      </span>
      {% endif %}
    </a>
    <div class="dropdown">
      <button class="btn btn-link text-decoration-none dropdown-toggle d-flex align-items-center gap-2 p-0" type="button" data-bs-toggle="dropdown">
        <span class="rounded-circle bg-aqua d-inline-flex align-items-center justify-content-center text-white" style="width:36px;height:36px;background:var(--aqua-primary);">
          <i class="fas fa-user"></i>
        </span>
        <span class="d-none d-md-inline text-dark fw-semibold">
          {{ user.get_full_name|default:user.username }}
          <small class="d-block text-muted" style="font-size:0.7rem;">{{ user.get_role_display }}</small>
        </span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow">
        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="fas fa-user me-2"></i>Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'accounts:change_password' %}"><i class="fas fa-key me-2"></i>Change Password</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="{% url 'accounts:logout' %}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</header>
