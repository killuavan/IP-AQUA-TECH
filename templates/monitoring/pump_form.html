{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card card-aqua">
      <div class="card-header">{{ title }}</div>
      <div class="card-body">
        <form method="post">{% csrf_token %}
          <div class="row">
            {% for field in form %}
            <div class="col-md-6 mb-3">
              <label class="form-label">{{ field.label }}</label>{{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
            </div>
            {% endfor %}
          </div>
          <button type="submit" class="btn btn-aqua">Save</button>
          <a href="{% url 'monitoring:pump_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
